<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#073d2b"><title>ZENTRO | One Store. Endless Choices.</title>
<style>
:root{--g:#073d2b;--g2:#0b6940;--lime:#cafa25;--bg:#f7f9f2;--ink:#18251e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}
.top{background:var(--g);color:white;text-align:center;padding:9px;font-size:12px}
header{background:white;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px #0001}
.nav{max-width:1200px;margin:auto;padding:13px 18px;display:flex;align-items:center;gap:18px;justify-content:space-between}
.logo{font-size:27px;font-weight:900;color:var(--g);letter-spacing:1px}.logo b{background:var(--lime);padding:8px 12px;border-radius:12px;margin-right:7px}
nav{display:flex;gap:18px;font-size:14px}nav a{color:var(--g);text-decoration:none;font-weight:bold}
.search{padding:11px 14px;border:1px solid #dce4da;border-radius:22px;min-width:180px}
button,.btn{border:0;border-radius:22px;background:var(--g);color:white;padding:11px 16px;font-weight:bold;cursor:pointer}
main{max-width:1200px;margin:auto;padding:18px}
.hero{border-radius:22px;overflow:hidden;background:var(--g);color:white}
.hero img{width:100%;display:block}
h2{color:var(--g);margin:30px 0 14px}
.categories{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.cat{background:white;border:1px solid #e3eade;border-radius:15px;padding:17px 8px;text-align:center;cursor:pointer;font-weight:bold;color:var(--g)}
.cat span{display:block;font-size:32px;margin-bottom:8px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:white;border:1px solid #e2e9df;border-radius:17px;padding:13px;box-shadow:0 3px 10px #00000008}
.pic{height:115px;border-radius:12px;background:#eff6e8;display:grid;place-items:center;font-size:58px}
.card h3{font-size:15px;margin:12px 0 5px}.price{font-weight:900;color:#087b37;font-size:18px}.unit{font-size:12px;color:#657168}
.actions{display:flex;gap:7px;margin-top:10px}.actions button{flex:1;padding:9px 6px;font-size:12px}.buy{background:#b6eb00;color:#17320f}
.cartbox{background:#eaf5e4;padding:18px;border-radius:16px;margin-top:24px}
.cartrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #d2dfce;font-size:14px}
.muted{color:#68766c;font-size:13px}.contact{margin:25px 0;background:var(--g);color:white;padding:25px;border-radius:20px}
.contact h2{color:white;margin-top:0}.wa{display:inline-block;background:#16c65b;color:white;text-decoration:none;padding:13px 20px;border-radius:25px;font-weight:bold}
footer{text-align:center;background:#062b20;color:#d9e9dc;padding:25px}
@media(max-width:760px){nav{display:none}.nav{flex-wrap:wrap}.search{order:3;width:100%}.categories{grid-template-columns:repeat(2,1fr)}.products{grid-template-columns:repeat(2,1fr)}main{padding:12px}}
@media(max-width:380px){.products{grid-template-columns:1fr}}
</style></head>
<body>
<div class="top">🚚 ZENTRO · SHOP SMART · ONE STORE. ENDLESS CHOICES.</div>
<header><div class="nav"><div class="logo"><b>Z</b> ZENTRO</div><nav><a href="#home">Home</a><a href="#categories">Categories</a><a href="#products">Products</a><a href="#contact">Contact</a></nav><input id="search" class="search" placeholder="Search products..." oninput="render()"><button onclick="document.getElementById('cart').scrollIntoView()">🛒 Cart (<span id="count">0</span>)</button></div></header>
